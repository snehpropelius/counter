<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        body{
            background: black;
        }
        .box{
            background: white;
            width: 200px;
            height: 200px;
            position: relative;
            animation-name: ani1;
            animation-duration: 5s;
            animation-iteration-count: 5;
            animation-fill-mode: forwards;
        }

        @keyframes ani1 {
            from{
                top: 0;
                font-size: 60px;
                text-align: justify;
            }
            to{
                width: 50%;
                font-size: 100px;
                text-align: center;
                background: red;
                top: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="box">Netflix
    </div>
</body>
</html>
